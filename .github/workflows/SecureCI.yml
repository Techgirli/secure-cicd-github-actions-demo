name: Secure CI

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use secret securely
        run: echo "API_KEY is set"
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
